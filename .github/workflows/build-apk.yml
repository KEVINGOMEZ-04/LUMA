name: Build LUMA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Local Web Assets & App Icon
        run: |
          mkdir -p www
          cp -r index.html manifest.json css js data assets www/ || true
          cp sw.js www/ || true

      - name: Install Dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Inject Android Permissions & Native Features
        run: |
          node scripts/configure-android.js || true

      - name: Generate App Icons from Official Logo
        run: |
          npm install -g @capacitor/assets || true
          if [ -f assets/icon.png ]; then
            mkdir -p resources
            cp assets/icon.png resources/icon.png
            cp assets/icon.png resources/splash.png
            find android/app/src/main/res -name "ic_launcher*.png" -exec cp assets/icon.png {} \; || true
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename & Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/LUMA.apk

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-APK
          path: build-output/LUMA.apk

      - name: Publish Release with LUMA.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "LUMA v1.0.0 (APK Oficial)"
          body: |
            # LUMA — Plataforma Móvil Nativa

            Aplicación móvil nativa oficial de **LUMA**.

            ### Características:
            - Pantalla completa nativa (sin barras de navegador).
            - Acceso a cámara, galería y micrófono.
            - Notificaciones en la barra de estado.
            - Interfaz oscura Midnight OLED de alto rendimiento.

            ### Instalación directa en Android:
            1. Descarga el archivo **`LUMA.apk`** adjunto aquí abajo en tu celular.
            2. Abre el archivo descargado para instalarlo.
            3. Si tu celular te solicita permiso de *"Instalar aplicaciones desconocidas"*, dale en **Permitir**.
            4. ¡Abre **LUMA** directamente desde tu pantalla de inicio!
          files: build-output/LUMA.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}