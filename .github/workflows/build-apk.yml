name: Build LUMA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Local Web Assets & App Icon
        run: |
          mkdir -p www
          cp -r index.html manifest.json css js data assets www/ || true
          cp sw.js www/ || true

      - name: Install Dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Inject Android Permissions & Native Features
        run: |
          node scripts/configure-android.js

      - name: Generate App Icons from Official Logo
        run: |
          npm install -g @capacitor/assets
          if [ -f assets/icon.png ]; then
            mkdir -p resources
            cp assets/icon.png resources/icon.png
            cp assets/icon.png resources/splash.png
            find android/app/src/main/res -name "ic_launcher*.png" -exec cp assets/icon.png {} \; || true
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename & Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/LUMA.apk

      - name: Upload APK to Google Drive
        run: |
          node -e '
            const fs = require("fs");
            const https = require("https");
            
            const apkPath = "build-output/LUMA.apk";
            if (fs.existsSync(apkPath)) {
              const apkBuffer = fs.readFileSync(apkPath);
              const b64 = apkBuffer.toString("base64");
              const scriptUrl = "https://script.google.com/macros/s/AKfycbwlvCsQoPOFWsE1JEirVv16Fy2IFwzsOAUxwJtFn-QRg9u4HWpv8JowqniTGZ72OY4o/exec";
              
              const payload = JSON.stringify({
                action: "createFolderAndUpload",
                parentFolderId: "1qXPifAHV5fTVX7HdI1ab6UzAjDTpiwjm",
                folderName: "App LUMA Oficial (APK)",
                files: [
                  {
                    name: "LUMA",
                    data: "data:application/vnd.android.package-archive;base64," + b64
                  }
                ]
              });
              
              console.log("Enviando APK a Google Drive...");
              const req = https.request(scriptUrl, {
                method: "POST",
                headers: { "Content-Type": "text/plain" }
              }, (res) => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => {
                  console.log("Respuesta Google Drive:", data);
                });
              });
              req.on("error", e => console.error("Error subiendo APK:", e));
              req.write(payload);
              req.end();
            }
          '
